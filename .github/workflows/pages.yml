# Publishes the browser app (and the no-camera demo) to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy website

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs: deploying in the same job right after
  # the upload failed with "No artifacts named github-pages" (the upload had
  # not registered yet).
  build:
    # Deploy only from the repository's default branch, whatever it is called.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Build demo
        run: node demo/build.mjs --standalone --out demo/standalone.html
      - name: Assemble site (app files only; no training code or tests)
        run: |
          mkdir _site
          cp index.html styles.css _site/
          cp -r src _site/src
          mkdir -p _site/model _site/demo
          cp model/ecg_template.json _site/model/
          cp demo/standalone.html _site/demo/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
